server:
  port: 8080
  error:
    include-message: always

spring:
  application:
    name: eduplan-ai-backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/eduplan_db}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:your-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:your-google-client-secret}
            scope:
              - email
              - profile

# Custom JWT Configuration
app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250655368566D5970337336763979244226452948404D6351}
    # 1 Day (in milliseconds)
    expiration-ms: 86400000

logging:
  level:
    org:
      springframework:
        security: INFO
        web: INFO
      hibernate:
        SQL: DEBUG
